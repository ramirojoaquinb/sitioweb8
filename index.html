<!DOCTYPE html>
<html lang="es">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Barajo</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Fraunces:wght@500;600&family=Inter:wght@400;500;600&display=swap" rel="stylesheet">
<style>
  :root {
    --bg: #F2F4EF;
    --card: #FFFFFF;
    --border: #E3E1D6;
    --border-hover: #C8C5B8;
    --ink: #1E2321;
    --ink-soft: #5B5F58;
    --gold: #A8710C;
    --gold-bg: #F4E8D2;
    --plum: #7B3B58;
    --plum-bg: #F1DEE7;
    --green: #1F6E4A;
    --green-bg: #DCEEE3;
  }
  * { box-sizing: border-box; }
  body {
    margin: 0;
    min-height: 100vh;
    background: var(--bg);
    color: var(--ink);
    font-family: 'Inter', system-ui, -apple-system, sans-serif;
    display: flex;
    align-items: center;
    justify-content: center;
    padding: 40px 20px;
  }
  main { width: 100%; max-width: 380px; }
  .header { text-align: center; margin-bottom: 32px; }
  .avatar {
    display: block;
    width: 84px;
    height: 84px;
    margin: 0 auto 16px;
    border-radius: 50%;
    object-fit: cover;
    border: 1px solid var(--border);
    background: var(--card);
  }
  .header h1 {
    font-family: 'Fraunces', serif;
    font-weight: 600;
    font-size: 28px;
    line-height: 1.2;
    margin: 0 0 8px;
    letter-spacing: -0.01em;
  }
  .header p { margin: 0; color: var(--ink-soft); font-size: 15px; }
  .links { display: flex; flex-direction: column; gap: 12px; }
  .link-btn {
    display: flex;
    align-items: center;
    gap: 14px;
    background: var(--card);
    border: 1px solid var(--border);
    border-radius: 16px;
    padding: 16px 18px;
    text-decoration: none;
    color: var(--ink);
    transition: border-color .15s ease, transform .15s ease;
  }
  .link-btn:hover { border-color: var(--border-hover); transform: translateY(-1px); }
  .link-btn:active { transform: translateY(0); }
  .link-btn:focus-visible { outline: 2px solid var(--ink); outline-offset: 2px; }
  .icon {
    width: 40px;
    height: 40px;
    border-radius: 50%;
    display: flex;
    align-items: center;
    justify-content: center;
    flex-shrink: 0;
  }
  .icon svg { width: 20px; height: 20px; }
  .icon.gold { background: var(--gold-bg); color: var(--gold); }
  .icon.plum { background: var(--plum-bg); color: var(--plum); }
  .icon.green { background: var(--green-bg); color: var(--green); }
  .label { flex: 1; font-size: 15px; font-weight: 500; }
  .chevron { color: #B7B4A8; flex-shrink: 0; }
  footer { text-align: center; margin-top: 28px; font-size: 12px; color: #9B988C; }
</style>
</head>
<body>
<main>

  <div class="header">
    <img class="avatar" src="barajo.png" alt="Foto del negocio">

    <h1>Barajo</h1>
    <p>Elegí una opción</p>
  </div>

  <div class="links">

    <a class="link-btn" href="https://search.google.com/local/writereview?placeid=ChIJHTTcHTK4vJURvzDXXVlhG9c" target="_blank" rel="noopener">
      <span class="icon gold" aria-hidden="true">
        <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round">
          <path d="M12 17.27 18.18 21l-1.64-7.03L22 9.24l-7.19-.61L12 2 9.19 8.63 2 9.24l5.46 4.73L5.82 21z"/>
        </svg>
      </span>
      <span class="label">Dejanos una reseña en Google</span>
      <span class="chevron" aria-hidden="true">
        <svg viewBox="0 0 24 24" width="16" height="16" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M9 6l6 6-6 6"/></svg>
      </span>
    </a>

    <a class="link-btn" href="https://instagram.com/rbj.barajo" target="_blank" rel="noopener">
      <span class="icon plum" aria-hidden="true">
        <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round">
          <rect x="3" y="3" width="18" height="18" rx="5"/>
          <circle cx="12" cy="12" r="4"/>
          <circle cx="17.5" cy="6.5" r="1" fill="currentColor" stroke="none"/>
        </svg>
      </span>
      <span class="label">Seguinos en Instagram</span>
      <span class="chevron" aria-hidden="true">
        <svg viewBox="0 0 24 24" width="16" height="16" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M9 6l6 6-6 6"/></svg>
      </span>
    </a>

    <a class="link-btn" href="https://wa.me/5491144102657" target="_blank" rel="noopener">
      <span class="icon green" aria-hidden="true">
        <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round">
          <path d="M21 11.5a8.38 8.38 0 0 1-.9 3.8 8.5 8.5 0 0 1-7.6 4.7 8.38 8.38 0 0 1-3.8-.9L3 21l1.9-5.7a8.38 8.38 0 0 1-.9-3.8 8.5 8.5 0 0 1 4.7-7.6 8.38 8.38 0 0 1 3.8-.9h.5a8.48 8.48 0 0 1 8 8v.5z"/>
        </svg>
      </span>
      <span class="label">Escribinos por WhatsApp</span>
      <span class="chevron" aria-hidden="true">
        <svg viewBox="0 0 24 24" width="16" height="16" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M9 6l6 6-6 6"/></svg>
      </span>
    </a>

  </div>

  <footer>Tocá o escaneá cuando quieras</footer>

</main>
</body>
</html>
